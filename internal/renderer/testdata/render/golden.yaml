apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: norriswu0
  namespace: argocd
spec:
  description: norriswu0 tenant
  destinations:
  - namespace: norriswu0-dev
    server: https://kubernetes.default.svc
  - namespace: norriswu0-prod
    server: https://kubernetes.default.svc
  namespaceResourceWhitelist:
  - group: ""
    kind: ServiceAccount
  - group: ""
    kind: Secret
  - group: apps
    kind: Deployment
  - group: postgresql.cnpg.io
    kind: Cluster
  - group: cert-manager.io
    kind: Issuer
  - group: example.com
    kind: Foo
  orphanedResources:
    warn: true
  sourceRepos:
  - https://github.com/norriswu0/apps.git
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: norriswu0-dev
  namespace: argocd
spec:
  generators:
  - matrix:
      generators:
      - list:
          elements:
          - repoURL: https://github.com/norriswu0/apps.git
            revision: main
      - git:
          directories:
          - path: '*/overlays/dev'
          repoURL: '{{repoURL}}'
          revision: '{{revision}}'
  template:
    metadata:
      name: '{{path[0]}}-dev-norriswu0'
    spec:
      destination:
        namespace: norriswu0-dev
        server: https://kubernetes.default.svc
      project: norriswu0
      source:
        path: '{{path}}'
        repoURL: '{{repoURL}}'
        targetRevision: '{{revision}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
        - ServerSideApply=true
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: norriswu0-prod
  namespace: argocd
spec:
  generators:
  - matrix:
      generators:
      - list:
          elements:
          - repoURL: https://github.com/norriswu0/apps.git
            revision: main
      - git:
          directories:
          - path: '*/overlays/prod'
          repoURL: '{{repoURL}}'
          revision: '{{revision}}'
  template:
    metadata:
      name: '{{path[0]}}-prod-norriswu0'
    spec:
      destination:
        namespace: norriswu0-prod
        server: https://kubernetes.default.svc
      project: norriswu0
      source:
        path: '{{path}}'
        repoURL: '{{repoURL}}'
        targetRevision: '{{revision}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
        - ServerSideApply=true
