{{- if .Values.ui.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: {{ include "noperator.name" . }}
    app.kubernetes.io/component: ui
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  name: {{ include "noperator.resourceName" (dict "suffix" "ui" "context" $) }}
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.ui.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "noperator.name" . }}
      app.kubernetes.io/component: ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "noperator.name" . }}
        app.kubernetes.io/component: ui
        helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/managed-by: {{ .Release.Service }}
    spec:
      serviceAccountName: {{ include "noperator.resourceName" (dict "suffix" "ui" "context" $) }}
      {{- with .Values.ui.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: ui
        image: "{{ .Values.ui.image.repository }}{{- if not (contains "@" .Values.ui.image.repository) }}:{{ .Values.ui.image.tag | default .Chart.AppVersion }}{{- end }}"
        {{- with .Values.ui.image.pullPolicy }}
        imagePullPolicy: {{ . }}
        {{- end }}
        ports:
        - containerPort: {{ .Values.ui.service.port }}
          name: http
          protocol: TCP
        {{- if .Values.ui.envSecret }}
        envFrom:
        - secretRef:
            name: {{ .Values.ui.envSecret }}
        {{- end }}
        {{- with .Values.ui.securityContext }}
        securityContext:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.ui.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
{{- end }}
